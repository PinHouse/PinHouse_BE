name: PinHouse-BE PR 파이프라인

on:
  pull_request:
    branches:
      - develop
      - release/**
      - main

env:
  JAVA_VERSION: "17"

# 빌드 여부만 파악
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      # PR 대상이 main이면 prod 프로파일, 그 외는 dev 프로파일 기준으로 빌드 가능 여부만 확인
      - name: Build with Gradle Wrapper
        run: |
          if [ "${{ github.base_ref }}" == "main" ]; then
            echo "Running Assemble for Main Branch (PROD profile)"
            ./gradlew clean assemble -Dspring.profiles.active=prod
          else
            echo "Running Assemble for Non-Main Branch (DEV profile)"
            ./gradlew clean assemble -Dspring.profiles.active=dev
          fi
