name: PinHouse-BE 비운영용 CI 파이프라인

on:
  push:
    branches:
      - develop
      - release/**

permissions:
  contents: read

# 동시성 제어: 동일한 브랜치에 새로운 커밋이 오면 이전 워크플로우 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 공통 설정
  JAVA_VERSION: "17"
  USER_MAP_JSON: ${{ secrets.USER_MAP_JSON }}
  BRANCH_NAME: ${{ github.ref_name }}
  ENV_TYPE: ${{ startsWith(github.ref_name, 'release/') && '🧪 스테이징(STAGING)' || '🛠️ 개발(DEV)' }}

  # GCP / Artifact Registry 설정
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_ARTIFACT_REGISTRY_REGION: ${{ secrets.GCP_ARTIFACT_REGISTRY_REGION }}
  GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ startsWith(github.ref_name, 'release/') && secrets.GCP_STG_ARTIFACT_REGISTRY_REPOSITORY || secrets.GCP_DEV_ARTIFACT_REGISTRY_REPOSITORY }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

  # Discord 설정
  DISCORD_WEBHOOK_NON_PROD_URL: ${{ secrets.DISCORD_WEBHOOK_NON_PROD_URL }}
  DISCORD_AVATAR_URL: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png


jobs:
  # Lint 설정
  lint:
    name: lint
    runs-on: ubuntu-22.04
    if: ${{ !github.event.created }}
    permissions:
      contents: read
      checks: write
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Java 및 Gradle 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: Lint (CheckStyle) 수행
        run: ./gradlew checkstyleMain

      - name: Lint (CheckStyle) 결과 리포트
        uses: lcollins/checkstyle-github-action@v2.0.0
        if: always()
        with:
          path: '**/build/reports/checkstyle/*.xml'
          title: 'Checkstyle 결과 Report'

  # CodeQL 기반 코드 정적 분석 실행
  static_analysis:
    runs-on: ubuntu-latest
    if: ${{ !github.event.created }}
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: true  # 정적 분석 실패 시 즉시 중단
      matrix:
        language: [ java-kotlin ]

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Java 및 Gradle 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: CodeQL 초기화
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: "./.github/codeql/code-ql-heavy.yml"

      - name: Build (Gradle)
        run: |
          chmod +x gradlew
          ./gradlew build -x test -x check

      - name: CodeQL 분석 수행
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: true

      - name: 보안 취약점 결과 확인 및 차단
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "⏳ 분석 결과가 GitHub에 반영되기를 기다리는 중 (10초)..."
          sleep 10
          
          # 1. 현재 이벤트가 push인지 pr인지에 따라 검색할 REF 설정
          # GITHUB_REF는 push일 땐 refs/heads/branch명, PR일 땐 refs/pull/번호/merge가 됩니다.
          CURRENT_REF="${{ github.ref }}"
          echo "📍 현재 Ref: $CURRENT_REF"
          
          # 2. API 호출하여 High/Critical 등급의 Open 상태인 알림 조회
          ALERTS=$(gh api "repos/${{ github.repository }}/code-scanning/alerts?tool_name=CodeQL&state=open&ref=$CURRENT_REF" \
            --jq '[.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical")]')
          
          COUNT=$(echo "$ALERTS" | jq 'length')
          
          if [ "$COUNT" -gt 0 ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌ 보안 검사 실패: 고위험(High/Critical) 취약점 $COUNT개 발견"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "$ALERTS" | jq -r '.[] | "- [\(.rule.security_severity_level)] \(.rule.description) \n   위치: \(.most_recent_instance.location.path)"'
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          else
            echo "✅ 보안 검사 통과: 현재 커밋($CURRENT_REF)은 안전합니다."
          fi
  # 추후 통합 테스트 과정 추가 예정

  # 도커 이미지 생성 및 업로드
  build:
    name: build
    needs: [ lint, static_analysis ]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: success()
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.timestamp.outputs.image_tag }}

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: GCP 자격 증명 설정
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token

      - name: 타임스탬프 기반 이미지 태그 생성
        id: timestamp
        run: |
          # SHA의 앞 7자리만 변수에 저장
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # 날짜와 SHORT_SHA를 결합하여 OUTPUT에 저장
          IMAGE_TAG="$(date +'%Y%m%d_%H%M%S')-$SHORT_SHA"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Artifact Registry 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 빌드 및 Artifact Registry 푸시
        env:
          IMAGE_TAG: ${{ steps.timestamp.outputs.image_tag }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.GCP_ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REGISTRY_REPOSITORY }}/${{ startsWith(github.ref_name, 'release/') && 'be-stg' || 'be-dev' }}:${{ env.IMAGE_TAG }}
            ${{ env.GCP_ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REGISTRY_REPOSITORY }}/${{ startsWith(github.ref_name, 'release/') && 'be-stg' || 'be-dev' }}:latest
          provenance: false
