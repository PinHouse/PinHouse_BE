services:

  # Mysql
  mysql:
    image: mysql:8.0
    container_name: pinhouse-mysql
    volumes:
      - ./mysql/conf.d/my.cnf:/etc/mysql/conf.d/my.cnf
      - mysql-data:/var/lib/mysql
    ports:
      - '3306:3306'
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    networks:
      - monitoring

  # Redis
  redis:
    image: redis:7.2.5
    container_name: pinhouse-redis
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - /bin/sh
      - /usr/local/bin/init-redis-acl.sh
    ports:
      - '6379:6379'
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/init-redis-acl.sh:/usr/local/bin/init-redis-acl.sh:ro
    networks:
      - monitoring

  # GCS Emulator (fake-gcs-server)
  gcs-emulator:
    image: fsouza/fake-gcs-server:1.49.2
    container_name: pinhouse-gcs-emulator
    ports:
      - '4443:4443'
    command:
      - -scheme=http
      - -host=0.0.0.0
      - -port=4443
      - -external-url=http://localhost:4443
    volumes:
      - gcs-data:/data
    networks:
      - monitoring
    restart: unless-stopped

  # 프로메테우스
  prometheus:
    image: prom/prometheus:latest
    container_name: pinhouse-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"
    networks:
      - monitoring
    restart: unless-stopped

  # 그라파나
  grafana:
    image: grafana/grafana:latest
    container_name: pinhouse-grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP}
    ports:
      - "3030:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  # Alloy
  alloy:
    image: grafana/alloy:v1.9.2
    container_name: pinhouse-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/lib/alloy/data
    volumes:
      # Docker 로그 수집
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 로컬 프로세스 로그 수집
      - ../log:/var/log/pinhouse:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/lib/alloy/data
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    networks:
      - monitoring
    restart: unless-stopped

  # Loki
  loki:
    image: grafana/loki:3.5.0
    container_name: pinhouse-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/data:/loki
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
    environment:
      TZ: "Asia/Seoul"
    networks:
      - monitoring

  # Tempo
  tempo:
    image: grafana/tempo:2.7.2
    container_name: pinhouse-tempo
    user: "0:0"
    command:
      - -config.file=/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ./tempo/data:/tmp/tempo
    environment:
      TZ: "Asia/Seoul"
    networks:
      - monitoring
    restart: unless-stopped

  # Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: pinhouse-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  mysql-data:
  alloy-data:
  gcs-data:
