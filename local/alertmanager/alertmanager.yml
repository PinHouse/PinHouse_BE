global:
  resolve_timeout: 5m

# 알림 경로 설정
route:
  group_by: [ 'alertname', 'cluster', 'service' ]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'

# 알림 수신자 설정
receivers:
  - name: 'default-receiver'
    # 로컬 개발 환경에서는 로그로만 출력
    # 실제 운영 환경에서는 Discord 설정
    # slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    #     channel: '#alerts'
    #     title: 'PinHouse Alert'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

# 알림 억제 규칙 (선택사항)
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: [ 'alertname', 'cluster', 'service' ]
